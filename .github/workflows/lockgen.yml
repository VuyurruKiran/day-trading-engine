name: Generate dependency lock

on:
  push:
    branches: [feature/m0-m1-foundation]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m0-m1-foundation
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv lock
      - name: Commit lock file if changed
        shell: bash
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: lock dependencies"
          git push origin HEAD:feature/m0-m1-foundation
