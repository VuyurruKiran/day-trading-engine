[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "day-trading-engine"
version = "0.3.0"
description = "Local day-trading research and decision engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "polars>=1.6,<2",
  "pyarrow>=17,<22",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/day_trading_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["day_trading_engine"]
omit = [
  "src/day_trading_engine/ui/app.py",
  "src/day_trading_engine/doctor.py",
]
