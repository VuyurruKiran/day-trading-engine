project:
  plan_version: "3.2"
  software_version: "0.3.0"
  timezone: "America/Edmonton"
  # 08:00 MT / 10:00 ET: after the opening-range sample, before midday decay.
  decision_time: "08:00"

validation:
  starting_cash_usd: 100.0
  allow_capital_top_up: false
  long_only: true
  cash_only: true
  leverage_allowed: false
  max_active_positions: 1
  manual_execution_only: true
  commissions_enabled: false
  slippage_enabled: false

research:
  daily_candidate_count: 30
  core_candidate_count: 20
  boundary_candidate_count: 5
  diversity_candidate_count: 5
  final_candidate_min: 1
  final_candidate_max: 5
  primary_candidate_max: 1
  historical_bootstrap_months_min: 12
  historical_bootstrap_months_preferred: 24
  monthly_refinement_review: true
  automatic_monthly_promotion: false

research_universe:
  target: 200
  refresh: monthly
  ipo_seasoning_sessions: 20
  max_spread_pct: 0.02
  min_coverage_ratio: 0.90
  max_sector_fraction: 0.25
  selector_version: "universe-v1"
  benchmark_symbols: [SPY, QQQ]

history:
  provider: alpaca
  minimum_months: 12
  preferred_months: 24
  interval: 1m

ranking:
  technical: 0.50
  market: 0.20
  news: 0.20
  reddit: 0.05
  fundamentals: 0.05
  missing_optional_weight_to: technical
  minimum_final_score: 0.50
  normalization_version: "normalized-v2"

extended_hours:
  historical_start: "04:00"
  historical_end: "20:00"
  technical_score_share: 0.20
  feature_version: "extended-v1"
  gate_mode: "shadow"
  gate_artifact: null

market_data:
  provider: "questrade"
  # Bootstrap/fallback only. Benchmarks are collected separately from research symbols.
  watchlist:
    - AAPL
    - MSFT
    - NVDA
    - AMD
    - AMZN
    - META
    - GOOGL
    - GOOG
    - TSLA
    - JPM
    - BAC
    - WMT
    - COST
    - XOM
    - CVX
    - CAT
    - DIS
    - NFLX
    - ORCL
    - CRM
    - INTC
    - QCOM
    - AVGO
    - MU
    - UBER
    - PYPL
    - XYZ
    - SHOP
    - F
    - GM
  quote_batch_size: 50
  max_latency_ms: 5000

risk:
  max_spread_pct: 0.01
  max_volatility: 0.05
  min_rvol: 1.0
  min_volume: 1000

strategy:
  family: "opening_range_vwap_continuation"
  entry_buffer_pct: 0.001
  stop_buffer_pct: 0.001
  reward_to_risk: 2.0

runtime:
  ui: "custom-local"
  metadata_store: "sqlite"
  analytical_store: "parquet"
  analytics_engine: "duckdb"
  ai_required_for_daily_run: false
